name: Bug report
description: Report a reproducible issue with Hoospec.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private specs or personal data. Report security vulnerabilities privately as described in SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Version or commit, browser, Node.js version, and server or GitLab Pages mode."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: "Use a small synthetic spec or ADR that reproduces the problem."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "Include a sanitized error or screenshot if useful."
    validations:
      required: true
