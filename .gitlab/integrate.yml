# Include this file from the existing project's .gitlab-ci.yml.
# Add hoospec-build to the existing Pages job's needs (keep its other dependencies).
# Then append: sh tools/hoospec/scripts/attach-pages.sh public
hoospec-build:
  image: node:24-bookworm-slim
  stage: .pre
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    HOOSPEC_PAGES_PATH: "hoospec"
  cache:
    key:
      files:
        - tools/hoospec/package-lock.json
    paths:
      - tools/hoospec/.npm/
  script:
    - cd tools/hoospec
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build:pages
    - node scripts/prepare-pages.mjs
  artifacts:
    paths:
      - .hoospec-pages/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
