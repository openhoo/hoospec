include:
  - local: .gitlab/copilot.yml

hoospec-copilot-login:
  extends: .hoospec-copilot-login
  script:
    - node scripts/copilot-login.mjs

image: node:24-bookworm-slim

stages:
  - verify
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  rules:
    - if: '$HOOSPEC_COPILOT_LOGIN == "1"'
      when: never
    - when: on_success
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build:pages
  pages:
    publish: out
  rules:
    - if: '$HOOSPEC_COPILOT_LOGIN == "1"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
