image: node:24-bookworm-slim

stages:
  - verify
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build:pages
  pages:
    publish: out
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
